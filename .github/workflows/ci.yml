name: CI

# Health gate for pull requests targeting master. Type-checks and builds the
# app so a PR can't be merged (and therefore go live) in a broken state.
# This workflow never deploys. See CLAUDE.md for the branching strategy.
on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
